<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub README Stats</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>GitHub README Stats</h1>
      <p>Genera tarjetas de estadísticas de GitHub para tu README</p>
    </header>

    <main>
      <aside class="input-section">
        <div class="form-group">
          <label for="username">Usuario de GitHub</label>
          <input type="text" id="username" placeholder="ej. EdgarG1013" autocomplete="off" spellcheck="false" />
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="theme-search">Tema</label>
            <span class="theme-current" id="theme-current">dracula</span>
          </div>
          <input type="search" id="theme-search" placeholder="Buscar tema…" />
          <div class="theme-grid" id="theme-grid" role="listbox" aria-label="Temas"></div>
        </div>

        <details class="customize" id="customize">
          <summary>Personalizar</summary>

          <div class="form-group">
            <div class="label-row">
              <label for="border_radius">Radio del borde</label>
              <output id="border_radius-value">14</output>
            </div>
            <input type="range" id="border_radius" min="0" max="30" value="14" />
          </div>

          <div class="color-grid">
            <label class="color-field"><input type="color" data-param="title_color" /><span>Título</span></label>
            <label class="color-field"><input type="color" data-param="text_color" /><span>Texto</span></label>
            <label class="color-field"><input type="color" data-param="icon_color" /><span>Iconos</span></label>
            <label class="color-field"><input type="color" data-param="bg_color" /><span>Fondo</span></label>
            <label class="color-field"><input type="color" data-param="border_color" /><span>Borde</span></label>
            <label class="color-field"><input type="color" data-param="ring_color" /><span>Anillo</span></label>
          </div>

          <div class="form-group" data-only="languages all">
            <div class="label-row">
              <label for="langs_count">Lenguajes a mostrar</label>
              <output id="langs_count-value">6</output>
            </div>
            <input type="range" id="langs_count" min="1" max="10" value="6" />
          </div>

          <div class="form-group" data-only="contributions all">
            <div class="label-row">
              <label for="days">Días de actividad</label>
              <output id="days-value">31</output>
            </div>
            <input type="range" id="days" min="7" max="365" step="1" value="31" />
          </div>

          <button type="button" class="btn small ghost" id="reset-btn">Restablecer colores</button>
        </details>
      </aside>

      <section class="preview-section">
        <div class="tabs" role="tablist" aria-label="Tipo de tarjeta">
          <button class="tab active" role="tab" aria-selected="true" data-card="stats">Stats</button>
          <button class="tab" role="tab" aria-selected="false" data-card="languages">Lenguajes</button>
          <button class="tab" role="tab" aria-selected="false" data-card="streak">Racha</button>
          <button class="tab" role="tab" aria-selected="false" data-card="contributions">Actividad</button>
          <button class="tab" role="tab" aria-selected="false" data-card="all">Todas</button>
        </div>

        <div class="preview-card" id="preview-container" data-bg="dark">
          <div class="preview-toolbar">
            <button type="button" class="bg-toggle" id="bg-toggle" aria-label="Cambiar fondo de la vista previa">Fondo: oscuro</button>
          </div>
          <div class="preview-body" id="preview-body">
            <p class="preview-placeholder">Escribe un usuario de GitHub para ver la vista previa</p>
          </div>
        </div>

        <div class="code-section" id="code-section" hidden>
          <div class="code-header">
            <div class="format-tabs" role="tablist" aria-label="Formato">
              <button class="format-tab active" data-format="markdown">Markdown</button>
              <button class="format-tab" data-format="html">HTML</button>
              <button class="format-tab" data-format="url">URL</button>
            </div>
            <button id="copy-code" class="btn small primary">Copiar</button>
          </div>
          <pre><code id="markdown-code"></code></pre>
        </div>
      </section>
    </main>

    <section class="support-section">
      <a href="https://github.com/EdgarG1013/README-STATS" target="_blank" rel="noopener" class="star-btn">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.751.751 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L1.818 6.37a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/></svg>
        Star en GitHub
      </a>
    </section>

    <footer>
      <p>Hecho con la ayuda de:</p>
      <div class="credits-links">
        <a href="https://github.com/Ashutosh00710/github-readme-activity-graph" target="_blank" rel="noopener">github-readme-activity-graph</a>
        <a href="https://github.com/Pranesh-2005/github-readme-stats-fast" target="_blank" rel="noopener">github-readme-stats-fast</a>
      </div>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/static/script.js"></script>
</body>
</html>
