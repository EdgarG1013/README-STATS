<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub README Stats</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>GitHub README Stats</h1>
      <p>Generate custom GitHub stats cards for your README</p>
    </header>

    <main>
      <div class="input-section">
        <div class="form-group">
          <label for="username">GitHub Username</label>
          <input type="text" id="username" placeholder="Enter your GitHub username" />
        </div>

        <div class="form-group">
          <label for="theme">Theme</label>
          <select id="theme">
            <option value="default">Default</option>
            <option value="dark">Dark</option>
            <option value="radical">Radical</option>
            <option value="tokyonight">Tokyo Night</option>
            <option value="onedark">One Dark</option>
            <option value="cobalt">Cobalt</option>
            <option value="gruvbox">Gruvbox</option>
            <option value="dracula">Dracula</option>
            <option value="monokai">Monokai</option>
            <option value="nord">Nord</option>
            <option value="gotham">Gotham</option>
            <option value="material-palenight">Material Palenight</option>
            <option value="github_dark">GitHub Dark</option>
            <option value="blue_navy">Blue Navy</option>
            <option value="aura_dark">Aura Dark</option>
            <option value="vision-friendly-dark">Vision Friendly Dark</option>
          </select>
        </div>

        <div class="tabs">
          <button class="tab active" data-card="stats">Stats Card</button>
          <button class="tab" data-card="languages">Languages Card</button>
          <button class="tab" data-card="streak">Streak Card</button>
          <button class="tab" data-card="contributions">Contributions</button>
        </div>
      </div>

      <div class="preview-section">
        <div class="preview-card" id="preview-container">
          <div class="preview-placeholder">
            Enter your GitHub username to see the preview
          </div>
        </div>

        <div class="actions">
          <button id="generate-btn" class="btn primary">Generate Card</button>
          <button id="copy-btn" class="btn secondary" disabled>Copy Markdown</button>
        </div>

        <div class="code-section" id="code-section" style="display: none;">
          <div class="code-header">
            <span>Markdown Code</span>
            <button id="copy-code" class="btn small">Copy</button>
          </div>
          <pre><code id="markdown-code"></code></pre>
        </div>
      </div>
    </main>

    <section class="support-section">
      <a href="https://github.com/EdgarG1013/README-STATS" target="_blank" class="star-btn">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.751.751 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L1.818 6.37a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/></svg>
        Star on GitHub
      </a>
    </section>

    <footer>
      <p>Built with the help of:</p>
      <div class="credits-links">
        <a href="https://github.com/Ashutosh00710/github-readme-activity-graph" target="_blank">github-readme-activity-graph</a>
        <a href="https://github.com/Pranesh-2005/github-readme-stats-fast" target="_blank">github-readme-stats-fast</a>
      </div>
    </footer>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
