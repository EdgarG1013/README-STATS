<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub README Stats</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>GitHub README Stats</h1>
      <p>Generate custom GitHub stats cards for your README</p>
    </header>

    <main>
      <div class="input-section">
        <div class="form-group">
          <label for="username">GitHub Username</label>
          <input type="text" id="username" placeholder="Enter your GitHub username" />
        </div>

        <div class="form-group">
          <label for="theme">Theme</label>
          <select id="theme">
            <option value="default">Default</option>
            <option value="dark">Dark</option>
            <option value="radikal">Radikal</option>
            <option value="tokyonight">Tokyo Night</option>
            <option value="onedark">One Dark</option>
            <option value="cobalt">Cobalt</option>
            <option value="gruvbox">Gruvbox</option>
            <option value="dracula">Dracula</option>
            <option value="monokai">Monokai</option>
            <option value="nord">Nord</option>
            <option value="gotham">Gotham</option>
            <option value="material-palenight">Material Palenight</option>
            <option value="github-dark">GitHub Dark</option>
            <option value="blue-navy">Blue Navy</option>
            <option value="coral">Coral</option>
            <option value="vision-nobledark">Vision Noble Dark</option>
          </select>
        </div>

        <div class="tabs">
          <button class="tab active" data-card="stats">Stats Card</button>
          <button class="tab" data-card="languages">Languages Card</button>
          <button class="tab" data-card="streak">Streak Card</button>
          <button class="tab" data-card="contributions">Contributions</button>
        </div>
      </div>

      <div class="preview-section">
        <div class="preview-card" id="preview-container">
          <div class="preview-placeholder">
            Enter your GitHub username to see the preview
          </div>
        </div>

        <div class="actions">
          <button id="generate-btn" class="btn primary">Generate Card</button>
          <button id="copy-btn" class="btn secondary" disabled>Copy Markdown</button>
        </div>

        <div class="code-section" id="code-section" style="display: none;">
          <div class="code-header">
            <span>Markdown Code</span>
            <button id="copy-code" class="btn small">Copy</button>
          </div>
          <pre><code id="markdown-code"></code></pre>
        </div>
      </div>
    </main>

    <footer>
      <p>Built with ❤️ by <a href="https://github.com/anuraghazra/github-readme-stats" target="_blank">anuraghazra</a></p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
